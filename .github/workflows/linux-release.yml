name: Linux release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional branch, tag, or SHA to build"
        required: false
        type: string
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux ${{ matrix.arch }} release binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04, first_target: sse2}
          - {arch: arm64, runner: ubuntu-24.04-arm, first_target: neon}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      NIM_VERSION: "2.2.6"
      CXX: clang++
      RELEASE_ARCH: ${{ matrix.arch }}
      FIRST_TARGET: ${{ matrix.first_target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false
          submodules: false
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            curl \
            gcc \
            git-lfs \
            lld \
            make \
            xz-utils \
            zlib1g-dev

      - uses: ./.github/actions/setup-nim-linux
        with:
          version: ${{ env.NIM_VERSION }}

      - name: Build release binaries
        id: build
        env:
          BUILD_REF: ${{ github.event.inputs.ref || github.ref }}
        run: |
          set -euo pipefail

          nim --version
          nimble --version
          clang --version
          ld.lld --version
          git lfs install --local

          ref="${BUILD_REF:-}"
          ref_name="${GITHUB_REF_NAME:-}"
          ref_type="${GITHUB_REF_TYPE:-}"
          case "$ref" in
            refs/tags/*)
              ref_type="tag"
              ref_name="${ref#refs/tags/}"
              ;;
            refs/heads/*)
              ref_type="branch"
              ref_name="${ref#refs/heads/}"
              ;;
            "")
              ;;
            *)
              ref_name="$ref"
              ;;
          esac

          version="$ref_name"
          version="${version#v}"
          make_args=()
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Using Makefile version ${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]} from ref ${ref_name}"
            make_args+=(
              "MAJOR_VERSION=${BASH_REMATCH[1]}"
              "MINOR_VERSION=${BASH_REMATCH[2]}"
              "PATCH_VERSION=${BASH_REMATCH[3]}"
            )
          else
            echo "Using Makefile default version for ref ${ref_name:-<unknown>}"
          fi

          if [[ "$ref_type" == "tag" && ( "$ref_name" == *alpha* || "$ref_name" == *beta* || "$ref_name" == *rc* || "$ref_name" == *dev* ) ]]; then
            make prereleases
          else
            make ci-releases "${make_args[@]}"
          fi

          first_binary="$(find bin -maxdepth 1 -type f -name "heimdall-*-linux-${RELEASE_ARCH}-${FIRST_TARGET}" -print -quit)"
          if [[ -z "$first_binary" ]]; then
            echo "Could not find built ${FIRST_TARGET} binary" >&2
            exit 1
          fi
          release_base="$(basename "$first_binary")"
          release_base="${release_base%-${FIRST_TARGET}}"

          mkdir -p artifacts
          cp "bin/${release_base}"-* artifacts/
          (
            cd artifacts
            sha256sum "${release_base}"-* > "SHA256SUMS-linux-${RELEASE_ARCH}.txt"
            tar -czf "${release_base}.tar.gz" "${release_base}"-* "SHA256SUMS-linux-${RELEASE_ARCH}.txt"
          )

          echo "artifact_name=${release_base}" >> "$GITHUB_OUTPUT"

      - name: Publish to Gitea release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITEA_BASE_URL: ${{ secrets.GITEA_BASE_URL }}
          GITEA_REPO: ${{ secrets.GITEA_REPO }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_RELEASE_BODY: "Automated release artifacts built by GitHub Actions."
        run: python scripts/publish_gitea_release.py --tag "$GITHUB_REF_NAME" --files artifacts/heimdall-*-linux-${RELEASE_ARCH}-* "artifacts/SHA256SUMS-linux-${RELEASE_ARCH}.txt"

      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: artifacts/*
          if-no-files-found: error
