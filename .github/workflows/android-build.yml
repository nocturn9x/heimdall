name: Build Android binaries

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [android-arm64-universal, android-amd64-universal]
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      NIM_VERSION: "2.2.6"
      NDK_VERSION: "28.2.13676358"
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false
      - name: Install Android NDK and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld curl gcc git-lfs make xz-utils python3 zlib1g-dev
          sdkmanager "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-nim-linux
        with:
          version: ${{ env.NIM_VERSION }}
      - name: Build and package production binary
        id: build
        run: |
          git lfs install --local
          python3 scripts/release.py build --target "$RELEASE_TARGET" --artifacts artifacts
      - name: Upload Android binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: artifacts/*
          if-no-files-found: error
